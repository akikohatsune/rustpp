name: CI & Multi-platform Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --release

  build-cross:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-musl
            artifact: oppai-linux-x86_64
            use_cross: false
          # Linux ARM 64-bit (aarch64)
          - target: aarch64-unknown-linux-musl
            artifact: oppai-linux-arm64
            use_cross: true
          # Linux ARM 32-bit (armv7)
          - target: armv7-unknown-linux-musleabihf
            artifact: oppai-linux-armv7
            use_cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.use_cross == false
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build native musl
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross (ARM)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/oppai dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
